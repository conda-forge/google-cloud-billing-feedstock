schema_version: 1

context:
  version: "1.21.0"

package:
  name: google-cloud-billing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/google-cloud-billing/google_cloud_billing-${{ version }}.tar.gz
  sha256: 735a5dff7d95f700abdea5248b625af5a4991311da7298087395071f0db2427e

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core-grpc >=2.28.0,<3.0.0
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    # tightest of upstream's floors (python >=3.14)
    - grpcio >=1.75.1,<2.0.0
    - proto-plus >=1.26.1,<2.0.0
    - protobuf >=6.33.5,<8.0.0
    - grpc-google-iam-v1 >=0.14.2,<1.0.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - google.cloud.billing
        - google.cloud.billing_v1
      pip_check: true

about:
  summary: Google Cloud Billing API client library
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-billing

extra:
  recipe-maintainers:
    - timpalpant
